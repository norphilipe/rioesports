name: Process FACEIT background jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faceit-background-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FACEIT processor
        env:
          CRON_URL: ${{ secrets.FACEIT_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL"
