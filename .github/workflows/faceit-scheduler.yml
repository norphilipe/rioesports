name: Process FACEIT background jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faceit-background-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FACEIT processor
        env:
          CRON_URL: ${{ secrets.FACEIT_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"

          response_file="$(mktemp)"
          status_code="$(curl --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL")"

          cat "$response_file"
          echo

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "FACEIT processor returned HTTP $status_code" >&2
            exit 1
          fi
