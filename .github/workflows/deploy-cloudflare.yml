name: Deploy Rio Esports to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rioesports-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:next
      - name: Restore Supabase runtime variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/rioesports`;
          const required = ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'];
          const fallbackVersions = [
            '2df1a85c-9b7a-449e-bfb1-8b41e024460f',
            'ea79279a-b7e5-41e2-aed8-cdc3cdfc7aff',
          ];

          async function api(path) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) {
              throw new Error(`Cloudflare API ${response.status}: ${JSON.stringify(body.errors || body)}`);
            }
            return body.result;
          }

          function bindingsFrom(detail) {
            return detail?.resources?.bindings || detail?.bindings || [];
          }

          function valuesFrom(bindings) {
            return Object.fromEntries(
              bindings
                .filter((binding) => binding.type === 'plain_text' && required.includes(binding.name))
                .map((binding) => [binding.name, binding.text])
            );
          }

          function hasRequired(values) {
            return required.every((name) => typeof values[name] === 'string' && values[name].length > 0);
          }

          function restore(values, versionId) {
            const configPath = 'wrangler.jsonc';
            const config = fs.readFileSync(configPath, 'utf8');
            const vars = JSON.stringify(values, null, 2).replace(/^/gm, '  ');
            const varsBlock = `  "vars": ${vars},\n`;
            const updated = config.includes('"vars"')
              ? config.replace(/  "vars": \{[\s\S]*?\n  \},\n/, varsBlock)
              : config.replace('  "keep_vars": true,\n', `${varsBlock}  "keep_vars": true,\n`);
            fs.writeFileSync(configPath, updated);
            console.log(`Restored required Supabase runtime variables from Worker version ${versionId}`);
          }

          (async () => {
            const versionList = await api('/versions?per_page=50');
            const versions = Array.isArray(versionList)
              ? versionList
              : (versionList?.versions || versionList?.result || []);

            const candidates = [
              ...versions.map((version) => version.id).filter(Boolean),
              ...fallbackVersions,
            ];

            const seen = new Set();
            for (const versionId of candidates) {
              if (seen.has(versionId)) continue;
              seen.add(versionId);
              try {
                const detail = await api(`/versions/${versionId}`);
                const values = valuesFrom(bindingsFrom(detail));
                if (hasRequired(values)) {
                  restore(values, versionId);
                  return;
                }
              } catch (error) {
                if (fallbackVersions.includes(versionId)) {
                  console.log(`Known bootstrap version ${versionId} was not readable; continuing.`);
                }
              }
            }

            throw new Error('Could not find a deployed Worker version containing both required Supabase runtime variables. Refusing to deploy without them.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --keep-vars
      - name: Verify deployed Worker liveness
        run: |
          curl --fail --silent --show-error --max-time 20 https://rioesports.norphilipe.workers.dev/api/health/live
      - name: Verify deployed Worker readiness
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://rioesports.norphilipe.workers.dev/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Worker is live but its production dependencies are not ready." >&2
          exit 1
