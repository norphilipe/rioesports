name: Deploy Rio Esports to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rioesports-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:next
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --keep-vars
      - name: Verify deployed Worker liveness
        run: |
          curl --fail --silent --show-error --max-time 20 https://rioesports.norphilipe.workers.dev/api/health/live
      - name: Verify deployed Worker readiness
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://rioesports.norphilipe.workers.dev/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Worker is live but its production dependencies are not ready." >&2
          exit 1
