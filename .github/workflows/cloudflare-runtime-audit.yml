name: Cloudflare Runtime Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-runtime-audit.yml'
      - 'wrangler.toml'
      - 'wrangler.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Verify Cloudflare API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CF_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CF_ACCOUNT_ID is missing'; exit 1; }
          npx wrangler whoami
      - name: Audit deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deployments list --name rioesports
          npx wrangler secret list --name rioesports > /tmp/secrets.json
          echo 'Configured secret names:'
          cat /tmp/secrets.json
      - name: Assert required production configuration
        run: |
          required=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY)
          names=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8')); console.log(d.map(x=>x.name).join(' '))")
          missing=0
          for name in "${required[@]}"; do
            if ! echo " $names " | grep -q " $name "; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          done
          exit $missing
