name: Cloudflare Runtime Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-runtime-audit.yml'
      - 'wrangler.toml'
      - 'wrangler.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Verify Cloudflare API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CF_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CF_ACCOUNT_ID is missing'; exit 1; }
          npx wrangler whoami
      - name: Audit deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deployments list --name rioesports
          npx wrangler secret list --name rioesports > /tmp/secrets.json
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rioesports/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            > /tmp/settings.json
          echo 'Configured secret names:'
          node -e "const d=require('/tmp/secrets.json'); console.log(d.map(x=>x.name).join('\\n'))"
          echo 'Configured binding names/types:'
          node -e "const d=require('/tmp/settings.json'); if(!d.success) { console.error(JSON.stringify(d)); process.exit(1) }; for (const b of (d.result?.bindings||[])) console.log(b.name + ' (' + b.type + ')')"
      - name: Assert required production configuration
        run: |
          required=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY)
          secret_names=$(node -e "const d=require('/tmp/secrets.json'); console.log(d.map(x=>x.name).join(' '))")
          binding_names=$(node -e "const d=require('/tmp/settings.json'); console.log((d.result?.bindings||[]).map(x=>x.name).join(' '))")
          missing=0
          for name in "${required[@]}"; do
            if echo " $secret_names " | grep -q " $name "; then
              echo "OK secret: $name"
            elif echo " $binding_names " | grep -q " $name "; then
              echo "OK binding: $name"
            else
              echo "MISSING: $name"
              missing=1
            fi
          done
          exit $missing
