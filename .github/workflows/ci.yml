name: CI

on:
  push:
    branches: [main, migration/cloudflare-workers]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Temporary migration validation: package-lock.json has not yet been regenerated
      # after adding vinext/Vite dependencies.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  cloudflare-compatibility:
    if: github.ref == 'refs/heads/migration/cloudflare-workers' || github.event.pull_request.head.ref == 'migration/cloudflare-workers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Resolve the migration dependencies so vinext can run and expose real
      # compatibility/build issues instead of stopping at the stale lockfile.
      - run: npm install
      - run: npm run check:vinext
      - run: npm run build:vinext
